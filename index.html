<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Junki Magazine</title>
  <meta name="description" content="Junki Magazine. Psychadelic Mysticism delivered by Mind Inc.">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Landing page ("Third Eye"). Old links to a zine (index.html?zine=…) are sent on to zines.html. -->
  <script>if (/[?&]zine=/.test(location.search)) location.replace('zines.html' + location.search + location.hash);</script>
  <style>
    :root {
      --paper: #F2F0EB; --ink: #111111; --muted: rgba(17,17,17,.55);
      --pink: #FF48B0; --blue: #0078BF; --lime: #A6E81F;
      --display: 'Bricolage Grotesque', 'Arial Black', sans-serif;
      --body: 'Inter', system-ui, sans-serif;
      --label: 'Space Mono', ui-monospace, monospace;
      --ease-io: cubic-bezier(0.645, 0.045, 0.355, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--paper); }
    body { color: var(--ink); font-family: var(--body); font-weight: 500; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }

    /* the drawing, alive: one full-screen canvas behind everything */
    #eye { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
    .no-gl #eye { background: var(--paper) url(img/jonas-drawing.webp) center / 900px auto repeat; }

    /* scroll track: the dive into the eye happens over this height */
    .track { height: 260vh; height: 260svh; }

    .nav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 22px; font-size: 15px;
    }
    .nav a { text-decoration: none; color: var(--ink); background: var(--paper); padding: 4px 10px; border-radius: 500px; }
    .nav a:hover, .nav a.is-active { background: var(--ink); color: var(--paper); }

    /* the logo, printed in two inks slightly out of register, "boiling" */
    .mark {
      position: fixed; left: 50%; top: 44%; z-index: 5; pointer-events: none;
      width: min(78vw, 860px); aspect-ratio: 647 / 294;
      transform: translate(-50%, -50%) scale(var(--mark-s, 1)); opacity: var(--mark-o, 1);
    }
    .mark__ink {
      position: absolute; inset: 0;
      -webkit-mask: url(img/junki-logo.png) center / contain no-repeat; mask: url(img/junki-logo.png) center / contain no-repeat;
      transform: translate(var(--jx, 0px), var(--jy, 0px)) rotate(var(--jr, 0deg));
    }
    .mark__ink--b { background: var(--blue); }   /* behind, offset: shows only as a misprinted edge */
    .mark__ink--a { background: var(--pink); }
    .tagline {
      position: fixed; left: 50%; top: calc(44% + min(78vw, 860px) * 294 / 647 / 2 + 22px); z-index: 5;
      transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      font-family: var(--label); font-size: clamp(10px, 1vw, 13px); letter-spacing: .22em; text-transform: uppercase;
      background: var(--paper); padding: 5px 10px; opacity: var(--mark-o, 1);
    }

    .hint {
      position: fixed; left: 50%; bottom: 24px; z-index: 5; transform: translateX(-50%);
      font-family: var(--label); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      background: var(--paper); border: 1px solid var(--ink); border-radius: 500px; padding: 9px 14px;
      opacity: calc(1 - var(--p, 0) * 6); pointer-events: none; white-space: nowrap;
      animation: hint-in .8s var(--ease-out) 1.2s both;
    }
    @keyframes hint-in { from { opacity: 0; transform: translate(-50%, 10px); } }

    /* end of the dive */
    .enter {
      position: fixed; left: 50%; top: 50%; z-index: 6; transform: translate(-50%, -50%) scale(var(--enter-s, .9));
      opacity: var(--enter-o, 0); pointer-events: var(--enter-pe, none);
      display: inline-flex; align-items: center; gap: 12px; text-decoration: none; white-space: nowrap;
      font-family: var(--label); font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--paper); background: var(--ink); border-radius: 500px; padding: 18px 28px;
    }
    .enter::before { content: ''; width: 8px; height: 8px; background: var(--pink); transform: rotate(45deg); }
    .enter:hover { background: var(--pink); color: var(--ink); }
    .enter:hover::before { background: var(--ink); }

    @media (max-width: 640px) {
      .mark { top: 40%; width: 86vw; }
      .tagline { top: calc(40% + 86vw * 294 / 647 / 2 + 18px); font-size: 9.5px; letter-spacing: .16em; }
    }
  </style>
</head>
<body>
  <canvas id="eye" aria-hidden="true"></canvas>
  <nav class="nav" aria-label="Main">
    <a href="index.html" class="is-active" aria-current="page">Home</a>
    <a href="zines.html">Zines</a>
    <a href="about.html">About us</a>
  </nav>
  <h1 class="mark" aria-label="Junki Magazine"><span class="mark__ink mark__ink--b"></span><span class="mark__ink mark__ink--a"></span></h1>
  <p class="tagline">Psychadelic Mysticism delivered by Mind Inc.</p>
  <p class="hint">Scroll to look into the eye ↓</p>
  <a class="enter" href="zines.html">Enter the zines</a>
  <div class="track" aria-hidden="true"></div>

<script type="module">
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const root = document.documentElement;
const canvas = document.getElementById('eye');
const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });

// ── Logo boil: two inks jittering at 10 fps ───────────────────────────
const inks = document.querySelectorAll('.mark__ink');
if (!reduce) setInterval(() => {
  inks.forEach((el, i) => {
    const k = i ? 1 : 1.6;
    el.style.setProperty('--jx', ((Math.random() * 2 - 1) * 1.6 * k + (i ? 0 : 4)).toFixed(2) + 'px');
    el.style.setProperty('--jy', ((Math.random() * 2 - 1) * 1.6 * k + (i ? 0 : 3)).toFixed(2) + 'px');
    el.style.setProperty('--jr', ((Math.random() * 2 - 1) * 0.5).toFixed(2) + 'deg');
  });
}, 100);
else inks[0].style.setProperty('--jx', '4px');

// ── Scroll: dive into the eye ────────────────────────────────────────
let progress = 0;
function onScroll() {
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  progress = Math.min(1, Math.max(0, scrollY / max));
  root.style.setProperty('--p', progress.toFixed(3));
  root.style.setProperty('--mark-s', (1 + progress * 1.6).toFixed(3));
  root.style.setProperty('--mark-o', Math.max(0, 1 - progress * 2.2).toFixed(3));
  const e = Math.min(1, Math.max(0, (progress - 0.78) / 0.18));
  root.style.setProperty('--enter-o', e.toFixed(3));
  root.style.setProperty('--enter-s', (0.9 + e * 0.1).toFixed(3));
  root.style.setProperty('--enter-pe', e > 0.5 ? 'auto' : 'none');
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();

if (!gl) {
  root.classList.add('no-gl');
} else {
  start();
}

function start() {
  const VS = `#version 300 es
  in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;
  const FS = `#version 300 es
  precision highp float;
  uniform sampler2D uTex;
  uniform vec2 uRes;      // drawing buffer px
  uniform float uTime, uTile, uR, uZoom, uDpr;
  uniform vec2 uLens;     // lens centre, in "p" units (height = 1, origin centre)
  out vec4 o;
  const vec3 PAPER = vec3(0.949, 0.941, 0.922);
  const vec3 INK   = vec3(0.067);
  const vec3 PINK  = vec3(1.0, 0.282, 0.690);
  const vec3 BLUE  = vec3(0.0, 0.471, 0.749);
  const vec3 LIME  = vec3(0.651, 0.910, 0.122);

  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }

  // ink coverage of the drawing at point p (in "p" units), tiled
  float ink(vec2 p) { return texture(uTex, p * uTile + 0.5).a; }

  void main() {
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
    // dive: zoom toward the lens
    vec2 q = uLens + (p - uLens) / uZoom;
    // breathing + slow liquid flow
    float t = uTime;
    vec2 warp = vec2(fbm(q * 1.6 + vec2(t * 0.05, 0.0)), fbm(q * 1.6 + vec2(7.3, -t * 0.04))) - 0.5;
    q += warp * 0.035;
    q *= 1.0 + sin(t * 0.35) * 0.012;

    // the third-eye lens
    float d = length(p - uLens);
    float r = uR;
    float inside = 1.0 - smoothstep(r * 0.9, r, d);
    // magnify inside the lens (a soft bulge)
    vec2 ql = uLens + (q - uLens) * mix(0.62, 1.0, smoothstep(0.0, r, d));

    // outside: black linework on paper
    float a0 = ink(q);
    vec3 col = mix(PAPER, INK, a0 * 0.78);

    // inside: the same lines split into riso layers, slightly out of register
    float wob = sin(t * 1.3) * 0.0025;
    float aP = ink(ql + vec2(0.0045 + wob, 0.0015));
    float aB = ink(ql + vec2(-0.0035, -0.003 - wob));
    float aL = ink(ql);
    vec3 riso = PAPER;
    // lime halftone wash, dots bigger toward the centre
    vec2 cell = gl_FragCoord.xy / (6.0 * uDpr);
    float dotR = 0.55 * (1.0 - smoothstep(0.0, r, d)) + 0.12;
    float dots = 1.0 - smoothstep(dotR - 0.08, dotR, length(fract(cell) - 0.5));
    riso = mix(riso, riso * LIME, dots * 0.55);
    riso *= mix(vec3(1.0), BLUE, aB * 0.85);
    riso *= mix(vec3(1.0), PINK, aP * 0.9);
    riso = mix(riso, INK, aL * 0.25);
    col = mix(col, riso, inside);

    // a hand-drawn ring around the eye
    float ang = atan(p.y - uLens.y, p.x - uLens.x);
    float rr = r * (1.0 + (noise(vec2(ang * 3.0, floor(t * 10.0))) - 0.5) * 0.03);
    float ring = 1.0 - smoothstep(0.0012, 0.0032, abs(d - rr));
    col = mix(col, INK, ring * 0.9 * (1.0 - smoothstep(0.6, 1.0, r)));

    // paper grain
    col *= 0.96 + 0.04 * hash(gl_FragCoord.xy + floor(t * 12.0));
    o = vec4(col, 1.0);
  }`;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { tex: U('uTex'), res: U('uRes'), time: U('uTime'), tile: U('uTile'), r: U('uR'), zoom: U('uZoom'), lens: U('uLens'), dpr: U('uDpr') };

  // the drawing as a repeating texture
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  };
  img.src = 'img/jonas-drawing.webp';

  let dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize); resize();

  // lens follows the pointer / finger; wanders on its own when left alone
  const toP = (x, y) => [(x - innerWidth / 2) / innerHeight, -(y - innerHeight / 2) / innerHeight];
  let target = [0.18, -0.12], lens = target.slice(), lastMove = -1e9;
  const follow = e => { const pt = e.touches ? e.touches[0] : e; target = toP(pt.clientX, pt.clientY); lastMove = performance.now(); };
  addEventListener('pointermove', follow, { passive: true });
  addEventListener('touchmove', follow, { passive: true });
  addEventListener('touchstart', follow, { passive: true });

  const t0 = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const t = (now - t0) / 1000;
    const aspect = innerWidth / innerHeight;
    if (now - lastMove > 2500 && !reduce) {
      // idle: drift in a slow figure-eight
      target = [Math.sin(t * 0.23) * 0.32 * aspect, Math.sin(t * 0.37) * 0.22 - 0.05];
    }
    const k = reduce ? 1 : 0.08;
    lens[0] += (target[0] - lens[0]) * k; lens[1] += (target[1] - lens[1]) * k;
    // the dive: the lens grows to fill the screen and the drawing zooms in through it
    const pr = progress, ease = pr * pr;
    const baseR = aspect < 0.8 ? 0.2 : 0.17;
    gl.uniform1i(u.tex, 0);
    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform1f(u.time, reduce ? 0 : t);
    gl.uniform1f(u.tile, 0.55);
    gl.uniform1f(u.r, baseR + ease * 1.4);
    gl.uniform1f(u.zoom, 1 + ease * 3);
    gl.uniform2f(u.lens, lens[0] * (1 - ease), lens[1] * (1 - ease));
    gl.uniform1f(u.dpr, dpr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
