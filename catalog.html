<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog — Junki Magazine</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      font-family: 'Comic Neue', cursive;
      color: #000;
    }

    /* ── Header ── */
    header {
      border-bottom: 2px solid #000;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header a.back {
      font-size: 14px;
      font-weight: 700;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      padding: 4px 10px;
    }

    header a.back:hover { background: #000; color: #fff; }

    header h1 { font-size: 22px; font-weight: 700; }
    .catalog-logo { display: block; height: 44px; }
    .catalog-logo img { height: 100%; width: auto; display: block; }

    /* ── Catalog grid ── */
    .catalog {
      max-width: 900px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .catalog h2 {
      font-size: 28px;
      margin-bottom: 32px;
      border-bottom: 2px solid #000;
      padding-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 32px;
    }

    /* ── Zine card ── */
    .card {
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 148 / 210;
      background: #f0f0f0;
      border-bottom: 2px solid #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-cover .placeholder-text {
      font-size: 13px;
      color: #888;
      text-align: center;
      padding: 12px;
    }

    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-body h3 { font-size: 17px; font-weight: 700; }
    .card-body p  { font-size: 13px; color: #555; flex: 1; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-top: 2px solid #000;
    }

    .card-footer .price { font-size: 16px; font-weight: 700; }

    .card-footer button {
      background: #000;
      color: #fff;
      border: 2px solid #000;
      font-family: 'Comic Neue', cursive;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .card-footer button:hover {
      background: #fff;
      color: #000;
    }

  </style>
</head>
<body>

  <header>
    <a class="back" href="index.html">← Back</a>
    <a class="catalog-logo" href="index.html" aria-label="Junki Magazine, home"><img src="img/junki-logo.png" alt="Junki Magazine"></a>
    <h1>Catalog</h1>
  </header>

  <main class="catalog">
    <h2>Our zines</h2>

    <div class="grid" id="zine-grid">
      <!-- Cards injected by JS from the ZINES list below -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="zines.js?v=28"></script>
  <script src="order.js?v=28"></script>
  <script>
    // Zines come from zines.js (shared with the home page hero).
    var ZINES = window.JUNKI_ZINES || [];

    // Build grid
    var grid = document.getElementById('zine-grid');
    ZINES.forEach(function (zine) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<a class="card-cover" href="index.html?zine=' + zine.slug + '">' +
          (zine.cover
            ? '<img src="' + zine.cover + '" alt="' + zine.title + '">'
            : '<span class="placeholder-text" data-cover="' + zine.slug + '">Cover coming soon</span>') +
        '</a>' +
        '<div class="card-body">' +
          '<h3>' + zine.title + '</h3>' +
          '<p>' + zine.description + '</p>' +
        '</div>' +
        '<div class="card-footer">' +
          '<span class="price">' + window.junkiPrice(zine) + '</span>' +
          '<button data-issue="' + zine.title + '" data-slug="' + zine.slug + '">Buy</button>' +
        '</div>';
      grid.appendChild(card);
    });

    function openModal(issue) { window.JunkiOrder.open(issue); }

    grid.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-issue]');
      if (btn) openModal(btn.dataset.issue);
    });

    // catalog.html?zine=<slug> opens that issue's order form
    var wanted = new URLSearchParams(location.search).get('zine');
    var wantedZine = ZINES.find(function (z) { return z.slug === wanted; });
    if (wantedZine) openModal(wantedZine.title);
  </script>

  <!-- Generated riso covers for zines without a cover image (same as the hero) -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <script type="module">
    import { makeCover } from './covers.js?v=28';
    document.querySelectorAll('[data-cover]').forEach(async function (el) {
      var zine = (window.JUNKI_ZINES || []).find(function (z) { return z.slug === el.dataset.cover; });
      if (!zine) return;
      var c = await makeCover(zine, 'front', { cell: 9 });
      var img = new Image();
      img.alt = zine.title;
      img.src = c.toDataURL('image/jpeg', 0.85);
      el.replaceWith(img);
    });
  </script>

</body>
</html>
